schema_version: 1
name: jboss.container.maven.39.bash
version: '3.9'
description: Provides Maven v3.9 capabilities to an image.

labels:
- name: io.fabric8.s2i.version.maven
  value: "3.9"

envs:
- name: JBOSS_CONTAINER_MAVEN_39_MODULE
  value: /opt/jboss/container/maven/39/
- name: MAVEN_VERSION
  value: "3.9"

modules:
  install:
  - name: jboss.container.maven.module

packages:
  install:
  - maven

execute:
- script: configure.sh

